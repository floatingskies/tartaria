#
# Upstream setup hardcodes "chown -R 1000:1000" and unpacks into /home before
# it is guaranteed to be mounted. Hand the work to tartaria-brew instead, which
# resolves the local user and defers the install until one exists.

[Unit]
RequiresMountsFor=/home/linuxbrew
After=home.mount

[Service]
ExecStart=
ExecStart=/usr/libexec/tartaria-brew setup
